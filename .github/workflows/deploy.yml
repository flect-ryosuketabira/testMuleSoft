name: Deploy to Anypoint

on:
  push:
    branches: [main]
    paths: ['earthquake-sync/mule/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # mule-maven-plugin は Maven 3.9.x 前提。runner 標準の Maven (4系の可能性) だと
      # NoSuchMethodError (maven-resolver 不整合) になるため 3.9.9 を固定で使用
      - name: Install Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar xz -C "$HOME"
          echo "$HOME/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          "$HOME/apache-maven-3.9.9/bin/mvn" -v

      # Exchange(anypoint-exchange-v3)からの依存取得用にConnected Appで認証
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${{ secrets.ANYPOINT_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CLIENT_SECRET }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to CloudHub 2.0
        working-directory: earthquake-sync/mule
        run: >
          mvn -B -X clean deploy -DmuleDeploy
          -Danypoint.client.id='${{ secrets.ANYPOINT_CLIENT_ID }}'
          -Danypoint.client.secret='${{ secrets.ANYPOINT_CLIENT_SECRET }}'
          -Danypoint.env='${{ vars.ANYPOINT_ENV }}'
          -Danypoint.target='${{ vars.ANYPOINT_TARGET }}'
          -Danypoint.app.name='${{ vars.ANYPOINT_APP_NAME }}'
          -Dapi.key='${{ secrets.API_KEY }}'
          > "$GITHUB_WORKSPACE/mvn-debug.log" 2>&1

      # 失敗時のみ、原因らしき行を抽出して表示 (Secretsは自動マスクされる)
      - name: Show deploy failure details
        if: failure()
        run: |
          echo "=== deployer related lines ==="
          grep -iE "mule-deployer|cloudhub|anypoint\.mulesoft|status|forbidden|unauthorized|not found|conflict|invalid|bad request|HTTP/1|\b(400|401|403|404|409|422)\b|message|reason|ERROR\]|Exception" "$GITHUB_WORKSPACE/mvn-debug.log" | grep -viE "maven-resolver|Downloading|Downloaded|\[DEBUG\] +(Imported|Populating|Created|Configuring|\(f\)|\(s\)|org\.apache)" | tail -150
          echo "=== tail ==="
          tail -60 "$GITHUB_WORKSPACE/mvn-debug.log"
